<!DOCTYPE html>
<html lang="tr">
<head>
<script>(function(){try{if(localStorage.getItem('hb-isik-modu')==='acik'){document.documentElement.classList.add('aydinlik-mod');}}catch(e){}})();</script>
<meta charset="UTF-8">

</head>
<body>

    <line x1="10" y1="20.25" x2="14" y2="20.25"/>
    <line x1="10.6" y1="18.3" x2="13.4" y2="18.3"/>
  </svg>
</button>
<header class="site-header">
  <nav class="nav-cubugu">
    <a href="index.html" class="marka">
      <span class="marka-ad">Hukuk-u Beşer</span>
    </a>
    <button class="nav-toggle" aria-label="Menüyü aç/kapat" onclick="document.querySelector('.nav-menu').classList.toggle('acik')">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-menu">
      <li><a href="index.html">Ana Sayfa</a></li>
      <li><a href="yazilar.html">Yazılar</a></li>
      <li><a href="arsiv.html" class="aktif">Arşiv</a></li>
      <li><a href="hakkimizda.html">Hakkımızda</a></li>
      <li><a href="iletisim.html">İletişim</a></li>
    </ul>
  </nav>
</header>
<main>
  <section class="sayfa-basligi">
    <div class="konteyner">
      <span class="ust-baslik-etiketi">Görsel Hafıza</span>
      <h1>Medya Arşivi</h1>
      <p class="bolum-aciklama" style="margin:0 auto;">Tanıklığın belgesi — fotoğraf ve video çalışmalarımızdan bir seçki.</p>
    </div>
  </section>
  <section>
    <div class="konteyner" style="padding:20px 32px 120px;">
      <div class="galeri-sekmeler">
        <button class="filtre-btn aktif" data-kategori="Tümü">Tümü</button>
        <button class="filtre-btn" data-kategori="Fotoğraf">Fotoğraf</button>
        <button class="filtre-btn" data-kategori="Video">Video</button>

</main>

<!-- Büyütme (lightbox) katmanı -->
<div id="medya-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:1000;align-items:center;justify-content:center;padding:40px;cursor:zoom-out;">
  <div id="medya-overlay-icerik" style="max-width:90vw;max-height:90vh;"></div>
</div>

<style>
  .medya-oge{ cursor:pointer; transition:transform .2s ease, box-shadow .2s ease; }
  .medya-oge:hover{ transform:scale(1.03); box-shadow:0 8px 24px rgba(0,0,0,.4); }
</style>

<script src="yildizlar.js"></script>
<script src="isik.js"></script>
<script src="assets/js/content-loader.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  renderCollection("fotograf-listesi", "fotograflar", (entry) => {
    const kategori = entry.data.category || "";
    const isVideo = kategori === "Video" && entry.data.video_url;
    if (isVideo) {
      return `
        <div class="medya-oge" data-kategori="Video">
          <span class="medya-oynatici-rozet">Video</span>
          <iframe src="${entry.data.video_url}" style="width:100%;height:100%;border:0;" allowfullscreen title="${entry.data.title || ''}"></iframe>
        </div>`;
    }
    return `
      <div class="medya-oge" data-kategori="Fotoğraf">
        <img src="${entry.data.image}" alt="${entry.data.title || ''}" style="width:100%;height:100%;object-fit:cover;">
      </div>`;
  }).then(() => {
    aktifFiltreyiUygula();
  });

  // Filtre butonları
  document.querySelectorAll('.galeri-sekmeler .filtre-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.galeri-sekmeler .filtre-btn').forEach(function(b){ b.classList.remove('aktif'); });
      btn.classList.add('aktif');
      aktifFiltreyiUygula();
    });
  });

  function aktifFiltreyiUygula(){
    const aktifBtn = document.querySelector('.galeri-sekmeler .filtre-btn.aktif');
    const secilen = aktifBtn ? aktifBtn.dataset.kategori : 'Tümü';
    document.querySelectorAll('#fotograf-listesi .medya-oge').forEach(function(oge){
      const goster = (secilen === 'Tümü' || oge.dataset.kategori === secilen);
      oge.style.display = goster ? '' : 'none';
    });
  }

  // Büyütme (lightbox)
  const overlay = document.getElementById('medya-overlay');
  const overlayIcerik = document.getElementById('medya-overlay-icerik');

  document.getElementById('fotograf-listesi').addEventListener('click', function(e){
    const oge = e.target.closest('.medya-oge');
    if (!oge) return;
    const img = oge.querySelector('img');
    const iframe = oge.querySelector('iframe');
    if (img) {
      overlayIcerik.innerHTML = `<img src="${img.src}" alt="${img.alt}" style="max-width:90vw;max-height:90vh;display:block;border-radius:8px;">`;
    } else if (iframe) {
      overlayIcerik.innerHTML = `<iframe src="${iframe.src}" style="width:80vw;height:45vw;max-height:90vh;border:0;border-radius:8px;" allowfullscreen></iframe>`;
    }
    overlay.style.display = 'flex';
  });

  overlay.addEventListener('click', function(){
    overlay.style.display = 'none';
    overlayIcerik.innerHTML = '';
  });
});
</script>
</body>
</html>
